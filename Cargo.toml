[workspace]
resolver = "2"
members = [
    "crates/nvrdesk-core",
    "crates/nvrdesk-capture",
    "crates/nvrdesk-input",
    "crates/nvrdesk-pipeline",
    "crates/nvrdesk-codec",
    "crates/nvrdesk-rtsp",
    "crates/nvrdesk-onvif",
    "crates/nvrdesk-cli",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/rimtzg/NVRDesk"
authors = ["rimtzg"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
bytes = "1.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
fast_image_resize = "6.2"
jpeg-encoder = "0.7"
md-5 = "0.11"
noto-sans-mono-bitmap = { version = "0.4", default-features = false, features = ["regular", "bold", "size_16", "size_24", "unicode-basic-latin", "unicode-latin-1-supplement"] }
openh264 = "0.9.10"
quick-xml = "0.42"
rdevin = "0.1.0"
rtsp-types = "0.2.0"
serde = { version = "1.0", features = ["derive"] }
sha1 = "0.11"
socket2 = "0.6"
thiserror = "2.0"
tokio = { version = "1.49", features = ["full"] }
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.19", features = ["v4", "v5"] }
xcap = "0.9.10"
yuvutils-rs = "0.8.3"
