[workspace]
resolver = "2"
members = [
    "crates/nvrdesk-core",
    "crates/nvrdesk-capture",
    "crates/nvrdesk-pipeline",
    "crates/nvrdesk-codec",
    "crates/nvrdesk-rtsp",
    "crates/nvrdesk-cli",
]

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/rimtzg/NVRDesk"
authors = ["rimtzg"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
bytes = "1.11"
clap = { version = "4.5", features = ["derive"] }
fast_image_resize = "6.2"
openh264 = "0.9.10"
rtsp-types = "0.2.0"
thiserror = "2.0"
tokio = { version = "1.49", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
xcap = "0.9.10"
yuvutils-rs = "0.8.3"
