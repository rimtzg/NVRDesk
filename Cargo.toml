[workspace]
resolver = "2"
members = [
    "crates/nvrdesk-core",
    "crates/nvrdesk-capture",
    "crates/nvrdesk-input",
    "crates/nvrdesk-pipeline",
    "crates/nvrdesk-codec",
    "crates/nvrdesk-rtsp",
    "crates/nvrdesk-onvif",
    "crates/nvrdesk-daemon",
    "crates/nvrdesk-tray",
    "crates/nvrdesk-cli",
]

[workspace.package]
version = "0.4.4"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/rimtzg/NVRDesk"
authors = ["rimtzg"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
cpal = "0.18"
fast_image_resize = "6.2"
futures-core = "0.3"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
jpeg-encoder = "0.7"
md-5 = "0.11"
nokhwa = { version = "0.10.11", features = ["input-native", "output-threaded"] }
noto-sans-mono-bitmap = { version = "0.4", default-features = false, features = ["regular", "bold", "size_16", "size_24", "unicode-basic-latin", "unicode-latin-1-supplement"] }
openh264 = "0.9.10"
quick-xml = "0.42"
rcgen = "0.13"
rdevin = "0.1.0"
rtsp-types = "0.2.0"
rust-embed = "8.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
socket2 = "0.6"
srt-tokio = "0.4.4"
thiserror = "2.0"
tokio = { version = "1.49", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
toml = "1.2"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tray-icon = { version = "0.26", default-features = false }
uuid = { version = "1.19", features = ["v4", "v5"] }
xcap = "0.9.10"
yuvutils-rs = "0.8.3"
