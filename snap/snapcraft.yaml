name: nvrdesk
base: core24
adopt-info: nvrdesk
summary: Open-source ONVIF/RTSP/SRT virtual IP camera for POS & desktop monitoring
description: |
  NVRDesk turns desktops, screens, webcams, microphones, or external media
  sources into ONVIF Profile S/T + RTSP/RTSPS + SRT virtual IP cameras with
  POS visual auditing overlays (mouse clicks, PCI-safe keystroke OSD, dynamic
  ticket OSD, and privacy masks) plus an embedded Web UI.
license: MIT AND GPL-3.0-or-later
grade: stable
confinement: strict

apps:
  nvrdesk:
    command: bin/nvrdesk
    plugs:
      - network
      - network-bind
      - x11
      - wayland
      - desktop
      - desktop-legacy
      - unity7
      - opengl
      - screencast-legacy
      - camera
      - audio-record
      - audio-playback
      - home

  headless:
    command: bin/nvrdesk --no-tray
    plugs:
      - network
      - network-bind
      - x11
      - wayland
      - desktop
      - opengl
      - screencast-legacy
      - camera
      - audio-record
      - audio-playback
      - home

parts:
  nvrdesk:
    plugin: rust
    source: .
    rust-channel: stable
    rust-path:
      - crates/nvrdesk-cli
    override-pull: |
      craftctl default
      VERSION=$(grep -m1 '^version = "' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
      craftctl set version="$VERSION"
    build-packages:
      - libpipewire-0.3-dev
      - libclang-dev
      - libdbus-1-dev
      - libasound2-dev
      - libv4l-dev
      - libwayland-dev
      - libdrm-dev
      - libgbm-dev
      - libegl-dev
      - libxcb1-dev
      - libxcb-randr0-dev
      - libxcb-shm0-dev
      - libx11-dev
      - libxtst-dev
      - libxi-dev
      - pkg-config
    stage-packages:
      - ffmpeg
      - libpipewire-0.3-0t64
      - libdbus-1-3
      - libasound2t64
      - libv4l-0t64
      - libwayland-client0
      - libdrm2
      - libgbm1
      - libegl1
      - libxcb1
      - libxcb-randr0
      - libxcb-shm0
      - libx11-6
      - libxtst6
      - libxi6
      - xdg-desktop-portal
