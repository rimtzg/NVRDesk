name: Auto Version Bump

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write

jobs:
  bump:
    name: Bump Workspace Version
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Bump version if needed
        id: bump
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          git fetch origin main --depth=1
          git show origin/main:Cargo.toml > /tmp/base_cargo.toml
          NEXT_VER="$(python3 .github/scripts/bump_version.py /tmp/base_cargo.toml "$PR_LABELS")"
          if [ -z "$NEXT_VER" ]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cargo update --workspace --offline
          echo "next_ver=$NEXT_VER" >> "$GITHUB_OUTPUT"
          echo "bumped=true" >> "$GITHUB_OUTPUT"

      - name: Commit & push bumped version to PR branch
        if: steps.bump.outputs.bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock packaging/macos/Info.plist
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump version to ${{ steps.bump.outputs.next_ver }}"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
