always_on = false

[source]
kind = "screen"
display = 0
show_cursor = true

[encoder]
backend = "auto"
ffmpeg_path = "ffmpeg"

[main_stream]
enabled = true
path = "/stream1"
max_width = 1920
fps = 15
bitrate_bps = 2000000
idr_interval_secs = 2

[sub_stream]
enabled = true
path = "/stream2"
max_width = 640
fps = 8
bitrate_bps = 450000
idr_interval_secs = 2

[webcam]
enabled = false
device_index = 0
mode = "channel"
pip_position = "top_right"
pip_scale = 0.22
channel_path = "/webcam"
max_width = 640
fps = 10
bitrate_bps = 600000

[audio]
enabled = false
codec = "pcmu"
sample_rate = 8000

[recording]
enabled = false
directory = "./recordings"
segment_secs = 300
max_total_mb = 1024

[daemon]
web_ui_enabled = true
tray_enabled = true

[input_overlay]
enabled = true
show_clicks = true
show_cursor_highlight = false
show_keystrokes = true
keystroke_mode = "masked_digits"
keystroke_ttl_ms = 4000
click_ttl_ms = 400
excluded_windows = [
    "1Password",
    "Bitwarden",
    "KeePass",
]

[rtsp]
bind = "0.0.0.0"
port = 8554

[onvif]
enabled = true
http_port = 8080
discovery_enabled = true
device_name = "NVRDesk POS Camera"
manufacturer = "NVRDesk"
model = "Virtual IP Camera"
serial_number = "NVRDESK-001"
