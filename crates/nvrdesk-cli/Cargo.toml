[package]
name = "nvrdesk-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "nvrdesk"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
nvrdesk-core = { path = "../nvrdesk-core" }
nvrdesk-daemon = { path = "../nvrdesk-daemon" }
nvrdesk-tray = { path = "../nvrdesk-tray" }
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
base64.workspace = true
nvrdesk-capture = { path = "../nvrdesk-capture" }
nvrdesk-codec = { path = "../nvrdesk-codec" }
nvrdesk-input = { path = "../nvrdesk-input" }
nvrdesk-onvif = { path = "../nvrdesk-onvif" }
nvrdesk-pipeline = { path = "../nvrdesk-pipeline" }
nvrdesk-rtsp = { path = "../nvrdesk-rtsp" }
sha1.workspace = true
tokio-rustls.workspace = true

[package.metadata.deb]
maintainer = "rimtzg <https://github.com/rimtzg/NVRDesk>"
copyright = "2026, NVRDesk Contributors"
license-file = ["../../LICENSE", "0"]
extended-description = """
NVRDesk is a cross-platform, MIT-licensed ONVIF/RTSP virtual IP camera
for POS terminals and desktop monitoring."""
section = "video"
priority = "optional"
assets = [
    ["target/release/nvrdesk", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/nvrdesk/README.md", "644"],
]
